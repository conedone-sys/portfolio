<!DOCTYPE html>
<html lang="en" data-theme="dos">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>adept - console</title>
<meta name="description" content="adept - OSINT student. A portfolio that boots like a text console.">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:title" content="adept - console">
<meta property="og:description" content="adept - OSINT student. A portfolio that boots like a text console.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ctext x='1' y='12' font-family='monospace' font-size='11' fill='%2355ff55'%3E%26gt;_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/perfect-dos-vga-437">
<link rel="stylesheet" href="assets/style.css">
<script>try{var t=localStorage.getItem('pf-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>

<div id="tube" class="tube">
  <main id="screen" class="screen" role="log" aria-live="polite" aria-label="Terminal">
    <div id="output"></div>
    <div class="line input-line">
      <span id="prompt" class="prompt"></span><span id="cmdwrap" class="cmd-wrap"><span id="caret" class="caret"></span></span>
    </div>
  </main>
</div>

<div class="crt" aria-hidden="true"></div>
<div class="roll" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<svg class="fxdefs" aria-hidden="true" focusable="false" width="0" height="0">
  <filter id="crt-curve" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
    <feImage id="curve-map" result="map" preserveAspectRatio="none" x="0" y="0" width="100%" height="100%"></feImage>
    <feDisplacementMap id="curve-shift" in="SourceGraphic" in2="map" scale="0"
                       xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>
</svg>

<div id="setup" class="setup" hidden tabindex="-1">
  <div class="setup-inner">
    <div class="setup-bar"><span>BIOS SETUP UTILITY</span><span>v1.0</span></div>
    <div id="setup-sub" class="setup-sub"></div>
    <div id="setup-body" class="setup-body"></div>
    <div class="setup-bar setup-bar--foot">
      <span id="setup-save">ESC: save &amp; exit</span><span>&#8593;&#8595;: select</span><span>&#8592;&#8594;: change</span>
    </div>
  </div>
</div>

<input id="kbd" class="kbd-input" type="text" inputmode="text" autocomplete="off" autocorrect="off"
       autocapitalize="off" spellcheck="false" aria-label="Command input">

<noscript>
  <div class="nojs">
    <p>[adept - this portfolio is a text console and needs JavaScript]</p>
    <p>adept &middot; OSINT student</p>
    <p>mail: <a href="mailto:oyinoka@proton.me">oyinoka@proton.me</a> &middot; github: <a href="https://github.com/conedone-sys">conedone-sys</a></p>
  </div>
</noscript>

<script src="assets/content.js"></script>
<script src="assets/terminal.js"></script>
</body>
</html>
